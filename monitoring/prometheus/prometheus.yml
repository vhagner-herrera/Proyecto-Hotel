global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'hotel-microservices'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'auth-service:8081'
          - 'habitaciones-service:8082'
          - 'reservas-service:8083'
          - 'pagos-service:8084'
          - 'administracion-service:8085'
          - 'hotel-gateway:8080'
