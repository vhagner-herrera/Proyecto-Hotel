server:
  port: 8082

spring:
  application:
    name: habitaciones-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&prepareThreshold=0
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: hotel_habitaciones
    show-sql: false
    open-in-view: false

  # Solo broker y group-id: los deserializadores los define KafkaConsumerConfig
  # (en Spring Boot 4 los @KafkaListener requieren @EnableKafka explicito)
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}
    consumer:
      group-id: habitaciones-service-group

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: habitaciones-service
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.hotelbonaventura: INFO
    org.hibernate.SQL: WARN
