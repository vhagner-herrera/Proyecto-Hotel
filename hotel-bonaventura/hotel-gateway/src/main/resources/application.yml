server:
  port: 8080

spring:
  application:
    name: hotel-gateway
  cloud:
    gateway:
      # Rutas definidas en GatewayConfig.java via Java DSL

# URLs de microservicios (fallback a localhost para desarrollo local)
services:
  auth-url:          ${AUTH_SERVICE_URL:http://localhost:8081}
  habitaciones-url:  ${HABITACIONES_SERVICE_URL:http://localhost:8082}
  reservas-url:      ${RESERVAS_SERVICE_URL:http://localhost:8083}
  pagos-url:         ${PAGOS_SERVICE_URL:http://localhost:8084}
  admin-url:         ${ADMIN_SERVICE_URL:http://localhost:8085}

# Configuracion JWT: el secret SIEMPRE viene de la variable de entorno JWT_SECRET
# (sin fallback hardcodeado: un secret en el repositorio es un riesgo de seguridad)
jwt:
  secret: ${JWT_SECRET}

# Configuracion CORS
cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# Actuator: exponer health e info
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: hotel-gateway
  endpoint:
    health:
      show-details: always

# Logging: niveles INFO en adelante (DEBUG/TRACE degradan el rendimiento por peticion)
logging:
  level:
    com.hotelbonaventura.gateway: INFO
    org.springframework.cloud.gateway: WARN
