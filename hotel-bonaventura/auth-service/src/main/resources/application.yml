server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    # Supabase transaction pooler (puerto 6543).
    # prepareThreshold=0 es necesario para el pooler de Supabase.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&prepareThreshold=0
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: hotel_auth
        format_sql: false

# JWT: lee directamente las variables de entorno JWT_SECRET y JWT_EXPIRATION
# No se definen aqui para que JwtUtil las inyecte con @Value("${JWT_SECRET}")

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.hotelbonaventura.auth: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
